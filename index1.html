<!DOCTYPE html>
<!--
  Ian's Job Search Dashboard — recreated in Cursor from the Cowork "ian-job-search-dashboard"
  artifact (see context/cowork/Cowork_Export_Brief_for_Cursor.md §4.1). Fed by the
  job-search-daily-scan and job-search-weekly-sweep skills; patched by job-search-dashboard-sync.

  Data model (read this before editing JOBS or SYNCED_STATE by hand):
  - JOBS: array of job objects, one per tracker row that reached the dashboard (A-tier only,
    unless showB is toggled on in the UI). Fields mirror the "Job Tracker" sheet in
    data/Job_Search_Tracker.xlsx: id, dateFound, industry, company, role, level, location,
    comp, source, link, warmSignal, fitNotes, tier, status, notes.
  - SYNCED_STATE: { [job.id]: { reaction: "love"|"interested"|"pass"|null, archived: bool } }
    the last-known reaction/archive state baked in at generation time. The UI also mirrors
    live changes into localStorage so a reaction survives a refresh even before the next sync;
    use "Export sync JSON" to hand new reactions back to the dashboard-sync skill.
  - No historical rows are seeded here — the old Cowork dashboard's data lived only on Ian's
    Mac and wasn't in this repo's read scope. Starts empty pending the first live scan.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ian's Job Search Dashboard</title>
<style>
:root { color-scheme: light;
  --bg:#f8f9fb; --card:#ffffff; --ink:#1a2233; --muted:#6b7486; --line:#e6e9ef;
  --a-tier:#16a34a; --b-tier:#d97706; --c-tier:#9ca3af;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:20px 22px 60px; }
h1 { font-size:19px; font-weight:700; letter-spacing:-.2px; }
.sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
header { margin-bottom:14px; }
.controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0 6px; }
.seg { display:inline-flex; background:#eceff4; border-radius:9px; padding:3px; }
.seg button { border:0; background:transparent; padding:6px 13px; border-radius:7px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s; }
.seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,30,60,.14); }
select { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; background:#fff; color:var(--ink); }
input[type=text] { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; min-width:180px; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; }
.chip.on { color:var(--ink); border-color:currentColor; box-shadow:inset 0 0 0 1px currentColor; }
.spacer { flex:1; }
.count { font-size:12px; color:var(--muted); }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.bulkbtn { border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8; border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
.bulkbtn:hover { background:#dbeafe; }
.empty { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:40px 24px; text-align:center; color:var(--muted); }
.empty b { color:var(--ink); }
.row { background:var(--card); border:1px solid var(--line); border-radius:11px; margin-bottom:8px; overflow:hidden; transition:box-shadow .15s; }
.row:hover { box-shadow:0 2px 10px rgba(20,30,60,.08); }
.row.archived-row { opacity:.5; }
.rowhead { display:grid; grid-template-columns:60px 1fr 140px 90px; gap:12px; align-items:center; padding:12px 14px; cursor:pointer; }
.tier-badge { font-size:10.5px; font-weight:750; letter-spacing:.4px; padding:4px 8px; border-radius:6px; text-transform:uppercase; text-align:center; }
.tier-a { background:#dcfce7; color:var(--a-tier); }
.tier-b { background:#fef3c7; color:var(--b-tier); }
.tname .t { font-weight:650; font-size:14px; }
.tname .co { font-size:12.5px; color:#4b5568; margin-top:1px; }
.tname .meta { font-size:11.5px; color:var(--muted); margin-top:3px; }
.status-badge { font-size:11px; font-weight:650; color:var(--muted); text-align:center; }
.reaction-cell { display:flex; gap:4px; justify-content:flex-end; }
.reaction-cell button { border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 8px; font-size:13px; cursor:pointer; line-height:1; }
.reaction-cell button.on { border-color:currentColor; }
.reaction-cell button.love.on { background:#fee2e2; color:#dc2626; }
.reaction-cell button.interested.on { background:#dbeafe; color:#1d4ed8; }
.reaction-cell button.pass.on { background:#f1f2f5; color:#6b7280; }
.detail { display:none; border-top:1px solid var(--line); padding:14px 18px; background:#fcfdff; font-size:13px; }
.row.open .detail { display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
.detail h4 { font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:10px 0 3px; }
.detail h4:first-child { margin-top:0; }
.detail a { color:#2563eb; text-decoration:none; }
.detail a:hover { text-decoration:underline; }
.archivebtn { border:0; background:none; cursor:pointer; font-size:11.5px; color:#c9cfd9; }
.archivebtn:hover { color:#6b7486; }
.archivebtn.on { color:#374151; }
@media (max-width:760px){ .rowhead{grid-template-columns:44px 1fr 76px;} .status-badge{display:none;} .row.open .detail{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Ian's Job Search Dashboard</h1>
  <div class="sub" id="snapshot">Snapshot generated 2026-08-11 · 3 A-tier roles · A-tier shown by default · click any row for full detail &amp; link</div>
</header>

<div class="controls">
  <div class="seg" id="tierseg">
    <button data-t="a" class="on">A-tier</button>
    <button data-t="ab">A + B-tier</button>
  </div>
  <select id="statusfilter">
    <option value="">All statuses</option>
    <option value="New">New</option>
    <option value="Applied">Applied</option>
    <option value="Interviewing">Interviewing</option>
    <option value="Rejected">Rejected</option>
    <option value="Closed">Closed</option>
  </select>
  <select id="industryfilter">
    <option value="">All industries</option>
  </select>
  <input type="text" id="search" placeholder="Search company / role...">
  <button class="chip" id="showarchived">🗄 Show archived</button>
  <div class="spacer"></div>
  <div class="count" id="count"></div>
</div>

<div class="btnrow">
  <button class="bulkbtn" id="exportstate">⬇ Export sync JSON (reactions + archives)</button>
  <button class="bulkbtn" id="importstate">⬆ Import sync JSON</button>
  <input type="file" id="importfile" accept="application/json" style="display:none">
</div>

<div id="list"></div>
<div id="emptystate" class="empty" style="display:none;">
  <p><b>No jobs yet.</b></p>
  <p style="margin-top:6px;">Run the <b>job-search-daily-scan</b> or <b>job-search-weekly-sweep</b> skill to populate this dashboard from <code>data/Job_Search_Tracker.xlsx</code>.</p>
</div>

<script>
// ---- DATA (populated by job-search-dashboard-sync) ----
const JOBS = [
  {
    id: "openai-head-of-growth-gsis-2026-08-11",
    dateFound: "2026-08-11",
    industry: "AI",
    company: "OpenAI",
    role: "Head of Growth GSIs – Cognizant, Infosys & Wipro",
    level: "Head (Director/VP-equivalent)",
    location: "San Francisco, CA",
    comp: "$378K–$500K + equity",
    source: "OpenAI careers (openai.com), cross-verified via remoterocketship.com mirror",
    link: "https://openai.com/careers/head-of-growth-gsis-cognizant-infosys-and-wipro-san-francisco/",
    warmSignal: "none identified this run",
    fitNotes: "Partnerships/GTM ownership for OpenAI's GSI relationships (Cognizant, Infosys, Wipro) — strategy + partnership + revenue-impact ownership, executive-level cross-functional scope (Sales, Solutions, Product, Legal, Security). AI vertical direct match. Comp ceiling ($500K base) plus equity puts this within striking distance of the $500-600K target before equity is even counted.",
    status: "New",
    tier: "A",
    notes: "openai.com returned a Cloudflare bot-block on direct fetch (timed out twice); verified via two independent live mirrors (remoterocketship.com listing + the crawled openai.com snippet returned by WebSearch) showing matching title, scope, and comp."
  },
  {
    id: "alphasense-vp-partnerships-2026-08-11",
    dateFound: "2026-08-11",
    industry: "Market intelligence/research",
    company: "AlphaSense",
    role: "Vice President, Partnerships",
    level: "VP",
    location: "United States (remote-eligible)",
    comp: "$230K–$280K base + bonus + equity",
    source: "LinkedIn (specific posting, loads without login)",
    link: "https://www.linkedin.com/jobs/view/vice-president-partnerships-at-alphasense-4359462039",
    warmSignal: "none identified this run",
    fitNotes: "Direct market-intelligence vertical match (AlphaSense, occupational analog to Sensor Tower). \"Principal architect\" of AlphaSense's partnership strategy — full lifecycle ownership, executive relationships, GTM — squarely the strategy+partnerships hybrid scope Ian targets.",
    status: "New",
    tier: "A",
    notes: "Base comp alone is below the $500-600K target; credible path depends on bonus + equity at a high-growth, well-funded company (AlphaSense/Tegus). Softest part of the case."
  },
  {
    id: "block-square-head-of-growth-partnerships-2026-08-11",
    dateFound: "2026-08-11",
    industry: "Fintech/payments (watch-signal)",
    company: "Block (Square)",
    role: "Head of Growth Partnerships, Square",
    level: "Head (Director/VP-equivalent, team lead)",
    location: "Remote (Bay Area, CA anchor)",
    comp: "$239,600–$359,400 base (zone-based)",
    source: "Block careers (block.xyz)",
    link: "https://block.xyz/careers/jobs/5217611008",
    warmSignal: "none identified this run",
    fitNotes: "Fintech/payments watch-signal category. Strategy + partnerships + commercial ownership hybrid (deal structuring, executive relationships, team leadership, GTM) — strong scope match.",
    status: "New",
    tier: "A",
    notes: "Base comp tops at $359K; path to $500-600K needs bonus/equity at a public company (NYSE: XYZ), plausible but not guaranteed."
  }
];

const SYNCED_STATE = {};

// ---- runtime state ----
const LS_KEY = "jobSearchDashboardState_v1";
function loadLocalState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveLocalState(s) { localStorage.setItem(LS_KEY, JSON.stringify(s)); }
let state = Object.assign({}, SYNCED_STATE, loadLocalState());

let tierMode = "a";
let statusFilter = "";
let industryFilter = "";
let searchText = "";
let showArchived = false;
let openId = null;

function jobState(id) { return state[id] || { reaction: null, archived: false }; }
function setJobState(id, patch) {
  state[id] = Object.assign({}, jobState(id), patch);
  saveLocalState(state);
  render();
}

function populateIndustryFilter() {
  const sel = document.getElementById("industryfilter");
  const industries = Array.from(new Set(JOBS.map(j => j.industry).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">All industries</option>' +
    industries.map(i => `<option value="${escapeAttr(i)}">${escapeHtml(i)}</option>`).join("");
}

function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

function matchesFilters(j) {
  const st = jobState(j.id);
  if (!showArchived && st.archived) return false;
  if (tierMode === "a" && j.tier !== "A") return false;
  if (statusFilter && j.status !== statusFilter) return false;
  if (industryFilter && j.industry !== industryFilter) return false;
  if (searchText) {
    const hay = `${j.company} ${j.role}`.toLowerCase();
    if (!hay.includes(searchText.toLowerCase())) return false;
  }
  return true;
}

function reactionButtons(j) {
  const st = jobState(j.id);
  const mk = (key, label, cls) =>
    `<button class="${cls}${st.reaction === key ? " on" : ""}" data-reaction="${key}" data-id="${escapeAttr(j.id)}" title="${label}">${label === "Love it" ? "❤" : label === "Interested" ? "👍" : "✕"}</button>`;
  return `<div class="reaction-cell">
    ${mk("love", "Love it", "love")}
    ${mk("interested", "Interested", "interested")}
    ${mk("pass", "Pass", "pass")}
  </div>`;
}

function renderRow(j) {
  const st = jobState(j.id);
  const open = openId === j.id;
  return `<div class="row${open ? " open" : ""}${st.archived ? " archived-row" : ""}" data-id="${escapeAttr(j.id)}">
    <div class="rowhead" data-toggle="${escapeAttr(j.id)}">
      <div class="tier-badge tier-${j.tier === "A" ? "a" : "b"}">${escapeHtml(j.tier)}</div>
      <div class="tname">
        <div class="t">${escapeHtml(j.role)}</div>
        <div class="co">${escapeHtml(j.company)}${j.level ? " · " + escapeHtml(j.level) : ""}</div>
        <div class="meta">${escapeHtml(j.location || "")}${j.comp ? " · " + escapeHtml(j.comp) : ""}</div>
      </div>
      <div class="status-badge">${escapeHtml(j.status || "")}</div>
      ${reactionButtons(j)}
    </div>
    <div class="detail">
      <div>
        <h4>Fit notes</h4><p>${escapeHtml(j.fitNotes || "—")}</p>
        <h4>Warm network signal</h4><p>${escapeHtml(j.warmSignal || "—")}</p>
        <h4>Notes</h4><p>${escapeHtml(j.notes || "—")}</p>
      </div>
      <div>
        <h4>Source</h4><p>${escapeHtml(j.source || "—")}</p>
        <h4>Link</h4><p>${j.link ? `<a href="${escapeAttr(j.link)}" target="_blank" rel="noopener">${escapeHtml(j.link)}</a>` : "—"}</p>
        <h4>Date found</h4><p>${escapeHtml(j.dateFound || "—")}</p>
        <h4>Industry</h4><p>${escapeHtml(j.industry || "—")}</p>
        <p style="margin-top:10px;"><button class="archivebtn${st.archived ? " on" : ""}" data-archive="${escapeAttr(j.id)}">${st.archived ? "🗄 Unarchive" : "🗄 Archive"}</button></p>
      </div>
    </div>
  </div>`;
}

function render() {
  const filtered = JOBS.filter(matchesFilters);
  const list = document.getElementById("list");
  const empty = document.getElementById("emptystate");
  if (JOBS.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    document.getElementById("count").textContent = "";
    return;
  }
  empty.style.display = "none";
  list.innerHTML = filtered.map(renderRow).join("") || `<div class="empty">No jobs match the current filters.</div>`;
  document.getElementById("count").textContent = `${filtered.length} of ${JOBS.length} shown`;
}

document.addEventListener("click", (e) => {
  const toggle = e.target.closest("[data-toggle]");
  if (toggle && !e.target.closest("button")) {
    const id = toggle.getAttribute("data-toggle");
    openId = openId === id ? null : id;
    render();
    return;
  }
  const reactBtn = e.target.closest("[data-reaction]");
  if (reactBtn) {
    const id = reactBtn.getAttribute("data-id");
    const key = reactBtn.getAttribute("data-reaction");
    const cur = jobState(id).reaction;
    setJobState(id, { reaction: cur === key ? null : key });
    return;
  }
  const archBtn = e.target.closest("[data-archive]");
  if (archBtn) {
    const id = archBtn.getAttribute("data-archive");
    setJobState(id, { archived: !jobState(id).archived });
    return;
  }
});

document.getElementById("tierseg").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-t]");
  if (!btn) return;
  tierMode = btn.getAttribute("data-t");
  document.querySelectorAll("#tierseg button").forEach(b => b.classList.toggle("on", b === btn));
  render();
});
document.getElementById("statusfilter").addEventListener("change", (e) => { statusFilter = e.target.value; render(); });
document.getElementById("industryfilter").addEventListener("change", (e) => { industryFilter = e.target.value; render(); });
document.getElementById("search").addEventListener("input", (e) => { searchText = e.target.value; render(); });
document.getElementById("showarchived").addEventListener("click", (e) => {
  showArchived = !showArchived;
  e.target.classList.toggle("on", showArchived);
  render();
});

document.getElementById("exportstate").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `job-search-dashboard-sync-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("importstate").addEventListener("click", () => document.getElementById("importfile").click());
document.getElementById("importfile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      state = Object.assign({}, state, imported);
      saveLocalState(state);
      render();
    } catch (err) { alert("Could not parse that file as JSON."); }
  };
  reader.readAsText(file);
});

populateIndustryFilter();
render();
</script>
</body>
</html>
